<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Bild → Link</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    font-family:
        Arial,
        sans-serif;

    background: #101114;

    color: white;
}


.container {

    width: 100%;

    max-width: 650px;

    background: #1b1d22;

    padding: 30px;

    border-radius: 20px;
}


h1 {

    margin-top: 0;

}


.drop {

    display: block;

    margin-top: 25px;

    padding: 50px 20px;

    text-align: center;

    border: 2px dashed #555;

    border-radius: 15px;

    cursor: pointer;

    transition: 0.2s;

}


.drop:hover {

    border-color: white;

    background: #24262b;

}


input {

    display: none;

}


#preview {

    display: none;

    width: 100%;

    max-height: 350px;

    object-fit: contain;

    margin-top: 20px;

    border-radius: 12px;

}


button {

    width: 100%;

    margin-top: 15px;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


button:disabled {

    opacity: 0.4;

    cursor: not-allowed;

}


#status {

    margin-top: 15px;

    color: #aaa;

}


#result {

    display: none;

    margin-top: 20px;

    padding: 20px;

    background: #0e0f12;

    border-radius: 12px;

}


#linkBox {

    width: 100%;

    margin-top: 10px;

    padding: 12px;

    background: #191b20;

    border: 1px solid #333;

    border-radius: 8px;

    color: #6ecbff;

    word-break: break-all;

    font-family: monospace;

    line-height: 1.5;

}


#copyButton {

    background: #4caf50;

    color: white;

}


#openButton {

    background: #333;

    color: white;

}

</style>

</head>


<body>


<div class="container">


<h1>
🖼️ Bild → öffentlicher Link
</h1>


<p>
Bild auswählen und einen öffentlichen Link
erzeugen, den du anschließend in ChatGPT
verwenden kannst.
</p>


<label class="drop">

<strong>
📁 Bild auswählen
</strong>

<br><br>

Klicken oder Bild hierher ziehen

<input
    id="file"
    type="file"
    accept="image/*"
>

</label>


<img
    id="preview"
    alt="Vorschau"
>


<button
    id="uploadButton"
    disabled
>

Bild hochladen

</button>


<div id="status"></div>


<div id="result">

<strong>
✅ Dein Bild-Link:
</strong>


<div id="linkBox"></div>


<button id="copyButton">

📋 Link kopieren

</button>


<button id="openButton">

🔗 Bild öffnen

</button>


</div>


</div>


<script>

const fileInput =
    document.getElementById("file");

const preview =
    document.getElementById("preview");

const uploadButton =
    document.getElementById("uploadButton");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");

const linkBox =
    document.getElementById("linkBox");

const copyButton =
    document.getElementById("copyButton");

const openButton =
    document.getElementById("openButton");


let selectedFile = null;

let imageLink = "";


/*
    Datei auswählen
*/

fileInput.addEventListener(
    "change",
    () => {

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }


        if (!file.type.startsWith("image/")) {

            status.textContent =
                "❌ Bitte ein Bild auswählen.";

            return;
        }


        selectedFile = file;

        uploadButton.disabled = false;

        result.style.display =
            "none";


        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";


        status.textContent =
            "Ausgewählt: " +
            file.name;
    }
);


/*
    Upload
*/

uploadButton.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {
            return;
        }


        uploadButton.disabled =
            true;

        status.textContent =
            "⏳ Bild wird hochgeladen...";


        const formData =
            new FormData();


        formData.append(
            "image",
            selectedFile
        );


        try {

            const response =
                await fetch(
                    "/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Upload fehlgeschlagen."
                );
            }


            imageLink =
                data.link;


            /*
                LINK SICHTBAR MACHEN
            */

            linkBox.textContent =
                imageLink;


            result.style.display =
                "block";


            status.textContent =
                "✅ Fertig!";


        } catch (error) {

            status.textContent =
                "❌ " +
                error.message;

        } finally {

            uploadButton.disabled =
                false;
        }
    }
);


/*
    Kopieren
*/

copyButton.addEventListener(
    "click",
    async () => {

        try {

            await navigator.clipboard.writeText(
                imageLink
            );

            copyButton.textContent =
                "✅ Link kopiert!";


            setTimeout(
                () => {

                    copyButton.textContent =
                        "📋 Link kopieren";

                },
                2000
            );


        } catch (error) {

            /*
                Fallback für Browser,
                bei denen Clipboard API
                nicht funktioniert.
            */

            const textarea =
                document.createElement("textarea");

            textarea.value =
                imageLink;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();


            copyButton.textContent =
                "✅ Link kopiert!";

        }
    }
);


/*
    Bild öffnen
*/

openButton.addEventListener(
    "click",
    () => {

        if (imageLink) {

            window.open(
                imageLink,
                "_blank"
            );
        }
    }
);

</script>


</body>

</html>
